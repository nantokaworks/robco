version: "3"

tasks:
  release:
    desc: Local release pipeline for RobCo (preflight -> check -> build -> package -> tag -> publish -> verify). Pass --dry-run or --from=<stage> after --.
    cmds:
      - bash scripts/release.sh {{.CLI_ARGS}}

  release:dry:
    desc: Dry-run the release pipeline without pushing tags, creating releases, or updating Homebrew.
    cmds:
      - bash scripts/release.sh --dry-run {{.CLI_ARGS}}

  dev:
    desc: Run RobCo against ~/abyss (cargo run, as if launched from ~/abyss). Extra flags pass through after --.
    cmds:
      - cargo run -- ~/abyss {{.CLI_ARGS}}

  check:
    desc: Run local checks.
    cmds:
      - cargo fmt --all -- --check
      - cargo test
      - cargo clippy --all-targets --all-features -- -D warnings
      - RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  docs:
    desc: Build the mdbook specification into docs/book.
    cmds:
      - mdbook build docs

  docs:serve:
    desc: Serve the mdbook specification locally with live reload.
    cmds:
      - mdbook serve docs {{.CLI_ARGS}}

  pages:deploy:
    desc: Build the mdbook and publish docs/book to the gh-pages branch (GitHub Pages).
    cmds:
      - bash scripts/pages-deploy.sh {{.CLI_ARGS}}
