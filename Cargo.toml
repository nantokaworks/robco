[package]
name = "robco"
version = "0.1.17"
edition = "2024"

[dependencies]
ansi-to-tui = "7.0.0"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.51", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
nanoid = "0.4.0"
ratatui = "0.29.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
toml_edit = "0.22.27"

[dev-dependencies]
tempfile = "3.23.0"
